# Q4OS package manifest - machine readable metadata for build tooling and agents
source="q4os-welcome"
kind="internal"
binaries="q4os-welcome q4os-welcome-common q4os-welcome5"
targets="deb12 deb13 deb14 uqk3 uqk4 uqk5 rpi12"
publish_repo="q4os-welcome=qtde q4os-welcome-common=default q4os-welcome5=default"
upstream_url=""
upstream_watch=""
notes="One source for the three binaries since 4.4.0 (a84, 2026-09-25):
trinity/ (TQt frontend q4os-welcome, qtde repos only), plasma/ (plain Qt5
frontend q4os-welcome5, default repos) and shared/ (the toolkit-free actions
and wording both compile in); common/ holds the icon, the header images and the
welcome-screen gettext catalog (moved here from q4os-i18n). The former separate
q4os-welcome5 source (the generated _00_cd_wk_cpy_kde5 tree) is retired."
